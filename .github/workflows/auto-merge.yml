# NewView releases are not safe to merge automatically: public repo + unprotected main.
# Keep this file as a self-documenting manual policy until branch protection is enabled.
name: NewView automated merge disabled (release approval required)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Explain required manual release approval
        run: |
          echo "NO-GO: automatic PR merges are disabled for NewView."
          echo "Require protected main, explicit release-owner review, real-device evidence, rights clearance and signing gates."
          echo "Do not use CI success alone as production-merge authorization."
          echo "Review PR #167 and docs/RELEASE_ACCEPTANCE_MATRIX.md."
