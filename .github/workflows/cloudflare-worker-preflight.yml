name: Cloudflare Worker deployment preflight (no deploy)
on:
  pull_request:
    paths:
      - 'wrangler.json'
      - 'cloud/**'
      - 'web/**'
      - 'package.json'
      - 'tests/cloudflare-worker-build.test.mjs'
      - 'tools/smoke-public-newview.mjs'
      - '.github/workflows/cloudflare-worker-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the existing Cloudflare Worker
        run: npm run build
      - name: Test Worker entrypoint and required frontend assets
        run: node --test tests/cloudflare-worker-build.test.mjs
      - name: Verify public smoke checker syntax (no network)
        run: node --check tools/smoke-public-newview.mjs
      - name: Verify Wrangler deployment bundle without deploying
        run: npx --yes wrangler@4.158.0 deploy --dry-run --outdir /tmp/newview-worker-preflight
      - name: Confirm dry-run generated output
        run: test -d /tmp/newview-worker-preflight
