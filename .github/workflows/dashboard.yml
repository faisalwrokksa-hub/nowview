name: NowView Markets TV and web
on:
  push:
    paths: ['web/**', 'android/**', 'dashboard.py', 'tests/**', 'build-apk.*', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['web/**', 'android/**', 'dashboard.py', 'tests/**', 'build-apk.*', '.github/workflows/dashboard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline validation
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build cloud dashboard
        run: |
          node --test tests/cloud.test.mjs tests/live.test.mjs tests/indicators.test.mjs tests/stock-board.test.mjs tests/workspace-shell.test.mjs tests/news.test.mjs tests/media.test.mjs tests/myview.test.mjs tests/business.test.mjs tests/social.test.mjs tests/cross-workspace.test.mjs
          node --check web/app.js
          node --check web/stock-board.js
          node --check web/workspace-shell.js
          node --check web/news.js
          node --check web/media.js
          node --check web/myview.js
          node --check web/business.js
          node --check web/social.js
          node --check cloud/news.mjs
          node cloud/build.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build universal TV and phone APK
        run: bash build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nowview-markets-test-apk
          path: |
            build/nowview-markets.apk
            build/nowview-markets-unsigned.apk
          retention-days: 14
