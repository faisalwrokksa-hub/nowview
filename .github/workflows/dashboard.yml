name: NewView dashboard TV and web
on:
  push:
    branches: [main]
    paths: ['web/**', 'cloud/**', 'tools/**', 'package.json', 'wrangler.json', 'android/**', 'dashboard.py', 'tests/**', 'build-apk.*', 'scripts/verify-preview-apk.sh', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['web/**', 'cloud/**', 'tools/**', 'package.json', 'wrangler.json', 'android/**', 'dashboard.py', 'tests/**', 'build-apk.*', 'scripts/verify-preview-apk.sh', '.github/workflows/dashboard.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: newview-dashboard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline validation
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build cloud dashboard
        run: |
          node --test tests/*.test.mjs
          node --check web/app.js
          node --check web/stock-board.js
          node --check web/workspace-shell.js
          node --check web/news.js
          node --check web/media.js
          node --check web/tv-home.js
          node --check web/myview.js
          node --check web/offline-agents.js
          node --check web/offline-controls.js
          node --check web/business.js
          node --check web/social.js
          node --check web/external-links.js
          node --check cloud/news.mjs
          node cloud/build.mjs
      # Android is built exactly once by complete-apk-bundle.yml (and independently
      # on the simulated TV-emulator job). Repeating Android SDK and APK builds
      # in this dashboard validation job wasted runner time.
      - name: Archive exact GitHub source revision for backup
        run: |
          mkdir -p build
          git archive --format=zip --output=build/TheNewView-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: TheNewView-source-backup
          path: build/TheNewView-source.zip
          retention-days: 14
