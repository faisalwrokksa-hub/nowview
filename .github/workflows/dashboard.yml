name: NewView dashboard TV and web
on:
  push:
    paths: ['web/**', 'android/**', 'dashboard.py', 'tests/**', 'build-apk.*', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['web/**', 'android/**', 'dashboard.py', 'tests/**', 'build-apk.*', '.github/workflows/dashboard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline validation
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and build cloud dashboard
        run: |
          node --test tests/cloud.test.mjs tests/live.test.mjs tests/indicators.test.mjs tests/stock-board.test.mjs tests/workspace-shell.test.mjs tests/news.test.mjs tests/media.test.mjs tests/myview.test.mjs tests/business.test.mjs tests/social.test.mjs tests/cross-workspace.test.mjs tests/android-integration.test.mjs tests/release-preview.test.mjs tests/integration-snapshots.test.mjs tests/brand-runtime.test.mjs tests/device-security.test.mjs tests/tv-home-repair.test.mjs tests/watch-workspace.test.mjs tests/cloudflare-worker-build.test.mjs tests/offline-agents.test.mjs tests/iptv-inline-regression.test.mjs
          node --check web/app.js
          node --check web/stock-board.js
          node --check web/workspace-shell.js
          node --check web/news.js
          node --check web/media.js
          node --check web/tv-home.js
          node --check web/myview.js
          node --check web/offline-agents.js
          node --check web/offline-controls.js
          node --check web/business.js
          node --check web/social.js
          node --check web/external-links.js
          node --check cloud/news.mjs
          node cloud/build.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Build universal TV and phone APK
        run: bash build-apk.sh
      - name: Verify preview APK identity and bundled workspace assets
        run: bash scripts/verify-preview-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: newview-test-apk
          path: |
            build/newview.apk
            build/newview-unsigned.apk
          retention-days: 14
