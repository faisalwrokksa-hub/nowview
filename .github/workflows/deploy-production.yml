# Manual-only emergency publishing fallback. Production auto-publishing is owned by
# Cloudflare Workers Builds connected to GitHub main, not by GitHub Actions.
name: Deploy production (manual GitHub fallback)
on:
  workflow_dispatch:
    inputs:
      confirm_github_deployment:
        description: 'I disabled Cloudflare native production builds and intend to deploy through GitHub'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: nowview-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirm_github_deployment == true && vars.GITHUB_PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Refuse superseded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          if [[ "$(git rev-parse HEAD)" != "$CURRENT_SHA" ]]; then
            echo "::error::main advanced during checkout; rerun this workflow against the latest commit."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify candidate
        run: npm run verify
      - name: Verify Cloudflare deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::GitHub fallback requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production environment or repository secrets. Leave GitHub fallback disabled to use Cloudflare Workers Builds without these secrets."
            exit 1
          fi
          if [[ "$CLOUDFLARE_ACCOUNT_ID" != "d971aa01a0cdd29f016ff88565aded43" ]]; then
            echo "::error::Cloudflare account ID does not match the existing NewView Worker account."
            exit 1
          fi
      - name: Deploy verified current main to existing nowview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 deploy --config wrangler.json --name nowview
      - name: Verify live deployment
        env:
          NEWVIEW_URL: https://nowview.faisalwrokksa.workers.dev
          NEWVIEW_EXPECTED_SHA: ${{ github.sha }}
        run: node tools/smoke-public-newview.mjs
