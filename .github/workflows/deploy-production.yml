name: Deploy production (after CI)
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: nowview-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.name == 'CI' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - name: Refuse superseded release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          [[ "$(git rev-parse HEAD)" == "$CURRENT_SHA" ]]
          if [[ -n "$TESTED_SHA" ]]; then [[ "$CURRENT_SHA" == "$TESTED_SHA" ]]; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repeat verification for tested revision
        run: npm run verify
      - name: Deploy existing nowview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          # Refuse deployment to unrelated Cloudflare accounts.
          test "$CLOUDFLARE_ACCOUNT_ID" = "d971aa01a0cdd29f016ff88565aded43"
          test -s dist/server/index.js
          npx --yes wrangler@4 deploy --config wrangler.json --name nowview
