name: NewView frontend auto-publish (verified)
on:
  push:
    branches: [feat/expert2-apk-audit-20261109]
    paths:
      - 'web/**'
      - 'cloud/**'
      - 'tests/**'
      - 'wrangler.json'
      - 'package.json'
      - '.github/workflows/frontend-auto-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: newview-frontend-publish
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dashboard and integration tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs
          for file in web/*.js web/*.mjs; do node --check "$file"; done
      - name: Build frontend
        run: npm run build
      - name: Validate Worker bundle
        run: node --test tests/cloudflare-worker-build.test.mjs
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: newview-frontend
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN in GitHub Actions secrets"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets"; exit 1; }
      - name: Build and publish verified frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build
          npx --yes wrangler@4.158.0 deploy --config wrangler.json
