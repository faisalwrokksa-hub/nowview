name: NewView frontend auto-publish (verified)
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'cloud/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - 'wrangler.json'
      - 'package.json'
      - '.github/workflows/frontend-auto-publish.yml'
  pull_request:
    paths: ['web/**', 'cloud/**', 'tests/**', 'tools/**', 'package.json', 'wrangler.json', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the tested main revision to production'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: newview-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run complete frontend validation
        run: npm run verify
      - name: Build frontend
        run: npm run build
      - name: Validate Worker bundle
        run: node --test tests/cloudflare-worker-build.test.mjs
  publish:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.FRONTEND_DEPLOY_VIA_GITHUB == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.deploy == true
    runs-on: ubuntu-24.04
    environment: newview-frontend
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_API_TOKEN in GitHub Actions secrets"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets"; exit 1; }
      - name: Build and publish verified frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build
          npx --yes wrangler@4.158.0 deploy --config wrangler.json --var NEWVIEW_REVISION:${{ github.sha }}
      - name: Confirm expected release is serving on the official deployment URL
        if: ${{ vars.NEWVIEW_PRODUCTION_URL != '' }}
        env:
          NEWVIEW_URL: ${{ vars.NEWVIEW_PRODUCTION_URL }}
          NEWVIEW_EXPECTED_SHA: ${{ github.sha }}
          NEWVIEW_REQUIRE_SOURCE_HEALTH: ${{ vars.NEWVIEW_REQUIRE_SOURCE_HEALTH }}
        run: node tools/smoke-public-newview.mjs
      - name: Require a configured verification URL for customer releases
        if: ${{ vars.NEWVIEW_ENFORCE_RELEASE_GATE == 'true' && vars.NEWVIEW_PRODUCTION_URL == '' }}
        run: |
          echo "::error::Set repository variable NEWVIEW_PRODUCTION_URL before enabling the release gate"
          exit 1

