name: NewView review validation

on:
  push:
    branches:
      - feat/newview-reference-theme-20261110
  pull_request:
    paths:
      - 'web/**'
      - 'tests/**'
      - 'cloud/**'
      - 'package.json'
      - '.github/workflows/newview-review-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          find web cloud tests tools -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r -n1 node --check
      - name: Run repository tests
        run: npm test
      - name: Build web
        run: npm run build
      - name: Build Pages
        run: npm run build:pages
