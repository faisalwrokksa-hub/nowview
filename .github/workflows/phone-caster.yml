name: NewView native Android phone caster
on:
  push:
    paths:
      - 'phone-caster/**'
      - '.github/workflows/phone-caster.yml'
  pull_request:
    paths:
      - 'phone-caster/**'
      - '.github/workflows/phone-caster.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-caster:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble isolated Android phone sender
        run: gradle -p phone-caster :app:assembleDebug --no-daemon --stacktrace
      - name: Verify phone sender artifact
        run: |
          test -s phone-caster/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p build
          cp phone-caster/app/build/outputs/apk/debug/app-debug.apk build/NewView-Phone-Caster-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NewView-Phone-Caster-test-APK
          path: build/NewView-Phone-Caster-test.apk
          retention-days: 14
