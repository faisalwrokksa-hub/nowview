name: Safe automatic PR merge

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: safe-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PRs after successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh pr list --base "$BASE" --state open --limit 100 --json number,isDraft --jq '.[] | select(.isDraft == false) | .number' |
          while read -r pr; do
            [ -n "$pr" ] || continue
            data=$(gh pr view "$pr" --json headRepository,headRefName,mergeable,reviewDecision,labels)
            if [ "$(jq -r '.headRepository.nameWithOwner // ""' <<<"$data")" != "$GH_REPO" ]; then continue; fi
            if [ "$(jq -r '.mergeable' <<<"$data")" != "MERGEABLE" ]; then continue; fi
            if [ "$(jq -r '.reviewDecision' <<<"$data")" = "CHANGES_REQUESTED" ]; then continue; fi
            if jq -e '[.labels[].name] | any(. == "do-not-merge" or . == "hold")' <<<"$data" >/dev/null; then continue; fi
            checks=$(gh pr checks "$pr" --json state 2>/dev/null) || continue
            # Do not merge untested PRs or PRs with failing, pending, or unknown checks.
            if ! jq -e 'length > 0 and all(.[]; (.state == "SUCCESS" or .state == "SKIPPED" or .state == "NEUTRAL"))' <<<"$checks" >/dev/null; then continue; fi
            # GitHub enforces branch protection, review requirements, and mergeability.
            gh pr merge "$pr" --squash --delete-branch || echo "PR #$pr blocked or changed; left open"
          done
