# The historical cross-repository scheduled auto-merge is deliberately retired.
# Never allow an external reusable workflow to promote unapproved NewView PRs.
name: NewView scheduled auto-merge retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require human release review
        run: |
          echo "NO-GO: scheduled/cross-repository automatic merging is disabled."
          echo "Use an owner-reviewed PR against protected main only after release acceptance."
