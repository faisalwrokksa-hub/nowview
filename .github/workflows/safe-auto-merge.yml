name: Safe automatic PR merge

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: guarded-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    uses: 2029TEBE/TEBE/.github/workflows/reusable-auto-merge.yml@5a33c633d2a8382844b9931b27da9b0ce42e54e1
