plugins { id 'com.android.application' }

android {
    namespace 'app.newview.phonecaster'
    compileSdk 35
    defaultConfig {
        applicationId 'app.newview.phonecaster'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-preview'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    // Open-source prebuilt WebRTC library (BSD 3-Clause), from Maven Central.
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
}
